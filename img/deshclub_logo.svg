<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="340" height="90">
  <defs>
    <!-- Purple Gradient for 'Desh' -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d65ff"/>
      <stop offset="50%" stop-color="#7c42f7"/>
      <stop offset="100%" stop-color="#5f27cd"/>
    </linearGradient>
    
    <!-- Gold/Orange Gradient for 'club' -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe3d"/>
      <stop offset="40%" stop-color="#ff8f17"/>
      <stop offset="100%" stop-color="#e8590c"/>
    </linearGradient>

    <!-- Gem Gradient -->
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#f59f00"/>
      <stop offset="100%" stop-color="#d9480f"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Group with glow shadow -->
  <g filter="url(#glow)">
    <!-- Emblem: Stylized Golden Diamond / Casino Shield -->
    <g transform="translate(14, 10)">
      <!-- Outer Hex/Diamond -->
      <polygon points="34,4 62,18 62,52 34,66 6,52 6,18" fill="url(#purpleGrad)" stroke="#ffe066" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Inner Diamond -->
      <polygon points="34,10 56,22 56,48 34,60 12,48 12,22" fill="#1b1034" opacity="0.85"/>
      <!-- Crown Top Accent -->
      <path d="M22,26 L26,36 L34,28 L42,36 L46,26 L48,42 L20,42 Z" fill="url(#goldGrad)" />
      <!-- Letter 'D' inside -->
      <text x="34" y="55" font-family="'Segoe UI', Roboto, 'Montserrat', Impact, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" filter="url(#accentGlow)">D</text>
      <!-- Sparkle -->
      <path d="M58,16 L60,10 L62,16 L68,18 L62,20 L60,26 L58,20 L52,18 Z" fill="#ffffff" opacity="0.95"/>
    </g>

    <!-- Main Wordmark Typography -->
    <!-- 'Desh' in dynamic Italic Sans-Serif -->
    <text x="92" y="62" font-family="'Segoe UI', Roboto, 'Arial Black', Impact, sans-serif" font-style="italic" font-weight="900" font-size="52" fill="url(#purpleGrad)" letter-spacing="-1">Desh</text>

    <!-- 'club' in fiery warm Gold/Amber -->
    <text x="216" y="62" font-family="'Segoe UI', Roboto, 'Arial Black', Impact, sans-serif" font-style="italic" font-weight="900" font-size="52" fill="url(#goldGrad)" letter-spacing="-1">club</text>

    <!-- Dot / Win Accent Star -->
    <g transform="translate(322, 28)">
      <polygon points="6,0 8,5 13,6 8,8 6,13 5,8 0,6 5,5" fill="#ffd43b" />
    </g>
  </g>
</svg>
