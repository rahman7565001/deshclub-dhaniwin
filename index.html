    <script>
        // Force lottery module to use this server only. This also clears old browser values saved by previous builds.
        (function(){
            try {
                localStorage.setItem('ar_g_api_url', JSON.stringify({api:'', draw:''}));
                localStorage.removeItem('api_url');
                localStorage.removeItem('draw_url');
            } catch(e) {}
            window._CONFIG_ = window._CONFIG_ || {};
            window._CONFIG_.api = '';
            window._CONFIG_.draw = '';
            window.__FORCE_LOCAL_API__ = true;

            // Global fetch interceptor to catch login/register response and sync currency
            const origFetch = window.fetch;
            window.fetch = async function(...args) {
                const res = await origFetch.apply(this, args);
                try {
                    const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
                    if (url.includes('Login') || url.includes('Register') || url.includes('GetUserInfo') || url.includes('login') || url.includes('register')) {
                        const clone = res.clone();
                        clone.json().then(data => {
                            if (data && data.data) {
                                const payload = data.data;
                                const userPhone = (payload.userName || payload.phone || payload.verifyMethods?.phone || '').toString();
                                let isBD = false;
                                if (payload.currency === 'BDT' || userPhone.startsWith('+880') || userPhone.startsWith('880') || userPhone.startsWith('01') || /^1[3-9]\d{8}$/.test(userPhone)) {
                                    isBD = true;
                                }
                                const targetCurr = isBD ? 'BDT' : 'INR';
                                const targetSymbol = isBD ? '৳' : '₹';
                                const prevSign = sessionStorage.getItem('dollarSign');
                                if (prevSign !== targetSymbol) {
                                    sessionStorage.setItem('dollarSign', targetSymbol);
                                    if (window._DATA_ && window._DATA_.homeSetting && window._DATA_.homeSetting.tenantConfig) {
                                        window._DATA_.homeSetting.tenantConfig.tenantCurrency = targetCurr;
                                        window._DATA_.homeSetting.tenantConfig.tenantCurrencyMarkCode = targetSymbol;
                                    }
                                    // Slight reload if currency changed upon successful login to refresh all view components
                                    setTimeout(() => {
                                        window.location.reload();
                                    }, 400);
                                }
                            }
                        }).catch(() => {});
                    }
                } catch(e) {}
                return res;
            };
        })();
    </script>

    <script>
        (function() {
            let isFetching = false;
            let categoriesData = null;

            async function ensurePaymentMethods() {
                const isRecharge = window.location.pathname.includes('/wallet/recharge') || 
                                   window.location.hash.includes('/wallet/recharge') || 
                                   !!document.querySelector('.payment-methods, .Recharge__container');
                if (!isRecharge) return;

                const optsContainer = document.querySelector('.payment-methods .payment-options, .payment-methods ul');
                if (!optsContainer) return;

                if (optsContainer.children.length > 0 && optsContainer.querySelector('.payment-item')) return;

                if (isFetching) return;
                isFetching = true;

                try {
                    if (!categoriesData) {
                        const res = await fetch('/api/Recharge/GetRechargeCategoryList', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: '{}'
                        });
                        const data = await res.json();
                        if (data && data.code === 0 && Array.isArray(data.data) && data.data.length > 0) {
                            categoriesData = data.data;
                        }
                    }

                    if (categoriesData && categoriesData.length > 0) {
                        if (optsContainer.children.length === 0 || !optsContainer.querySelector('.payment-item')) {
                            optsContainer.innerHTML = '';
                            categoriesData.forEach((pm, idx) => {
                                const li = document.createElement('li');
                                li.style.cursor = 'pointer';
                                const itemDiv = document.createElement('div');
                                itemDiv.className = 'payment-item' + (idx === 0 ? ' active' : '');
                                itemDiv.setAttribute('data-id', pm.id);
                                itemDiv.innerHTML = '<div class="payment_img"><img class="img" src="' + (pm.iconUrl || pm.selectedIconUrl) + '" alt="' + pm.name + '"></div><div class="name">' + pm.name + '</div>';
                                
                                itemDiv.onclick = function() {
                                    document.querySelectorAll('.payment-item').forEach(el => el.classList.remove('active'));
                                    itemDiv.classList.add('active');
                                    window.__SELECTED_PAYMENT_METHOD__ = pm;
                                    updateLimitsAndAmounts(pm);
                                };
                                li.appendChild(itemDiv);
                                optsContainer.appendChild(li);
                            });

                            window.__SELECTED_PAYMENT_METHOD__ = categoriesData[0];
                            updateLimitsAndAmounts(categoriesData[0]);
                        }
                    }
                } catch(e) {
                    console.error('ensurePaymentMethods error:', e);
                } finally {
                    isFetching = false;
                }
            }

            function updateLimitsAndAmounts(pm) {
                // Update Min/Max display
                const allP = Array.from(document.querySelectorAll('p, span, div'));
                const minMaxEl = allP.find(el => el.innerText && el.innerText.includes('Min:') && el.innerText.includes('Max:'));
                if (minMaxEl) {
                    minMaxEl.innerHTML = 'Min: ৳' + (pm.minAmount || 100) + ' Max: ৳' + (pm.maxAmount || 25000);
                }

                // Update amount-grid if empty
                const amountGrid = document.querySelector('.amount-grid');
                if (amountGrid && amountGrid.children.length === 0) {
                    const quicks = [100, 200, 300, 500, 1000, 2000, 5000, 10000];
                    amountGrid.innerHTML = '';
                    quicks.forEach((amt, i) => {
                        const li = document.createElement('li');
                        li.className = 'amount-item' + (i === 0 ? ' active' : '');
                        li.style.cursor = 'pointer';
                        li.innerHTML = '<span class="amount">৳' + amt + '</span>';
                        li.onclick = function() {
                            amountGrid.querySelectorAll('.amount-item').forEach(el => el.classList.remove('active'));
                            li.classList.add('active');
                            const input = document.querySelector('input[type="number"], .input-wrapper input, .recharge-input input');
                            if (input) {
                                input.value = amt;
                                input.dispatchEvent(new Event('input', { bubbles: true }));
                            }
                        };
                        amountGrid.appendChild(li);
                    });

                    // Set initial input amount to 100
                    const input = document.querySelector('input[type="number"], .input-wrapper input, .recharge-input input');
                    if (input && !input.value) {
                        input.value = 100;
                        input.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                }
            }

            // Global delegated click listener for "Pay now" button to guarantee instant checkout redirect
            document.addEventListener('click', function(e) {
                const target = e.target;
                if (!target) return;
                const btn = target.closest('.text_btn_main, .red-btn, .btn_main_style, [class*="btn_main"]');
                if (!btn) return;
                
                const isRechargePage = window.location.hash.includes('/wallet/recharge') || window.location.pathname.includes('/wallet/recharge');
                const text = (btn.innerText || '').trim().toLowerCase();
                const isPayBtn = text.includes('pay') || text.includes('recharge') || text.includes('deposit') || btn.classList.contains('text_btn_main') || btn.classList.contains('red-btn');
                
                if (!isRechargePage && !isPayBtn) return;
                if (!isPayBtn && !btn.classList.contains('text_btn_main')) return;

                console.log('[INDEX_CLICK] INSTANT REDIRECT TO CASHIER! Text:', text);
                e.preventDefault();
                e.stopPropagation();

                let amt = window.__SELECTED_AMOUNT__ || 100;
                const input = document.querySelector('input[type="number"], .recharge-input input, .input-wrapper input');
                if (input && input.value && Number(input.value) > 0) {
                    amt = Number(input.value);
                } else {
                    const activeAmtEl = document.querySelector('.amount-grid .active, .amount-item.active');
                    if (activeAmtEl) {
                        const parsed = parseInt(activeAmtEl.innerText.replace(/[^0-9]/g, ''));
                        if (parsed > 0) amt = parsed;
                    }
                }

                let catId = 400102;
                if (window.__SELECTED_PAYMENT_METHOD__ && window.__SELECTED_PAYMENT_METHOD__.id) {
                    catId = Number(window.__SELECTED_PAYMENT_METHOD__.id);
                } else {
                    const activePm = document.querySelector('.payment-item.active');
                    if (activePm && activePm.getAttribute('data-id')) {
                        catId = Number(activePm.getAttribute('data-id'));
                    }
                }

                const orderNo = 'PAY' + (new Date()).toISOString().replace(/[^0-9]/g, '').slice(0, 14) + Math.floor(1000 + Math.random() * 9000);
                const dest = '/pay/?orderNo=' + encodeURIComponent(orderNo) + '&amount=' + encodeURIComponent(amt) + '&catId=' + encodeURIComponent(catId);

                btn.innerText = 'Redirecting...';
                btn.style.opacity = '0.7';

                console.log('[INDEX_CLICK] Navigating now to:', dest);
                window.location.href = dest;
            }, true);

            window.addEventListener('hashchange', ensurePaymentMethods);
            window.addEventListener('popstate', ensurePaymentMethods);
            setInterval(ensurePaymentMethods, 400);
        })();
    </script>
